{% extends "base.html" %}
{% block title %}Create Tournament | {{ site_name }}{% endblock %}
{% block content %}
<div class="container section"><div class="card" style="max-width:900px; margin:auto;">
  <div class="card-header"><div><h1 class="section-title">Create Free Fire Tournament</h1><p class="section-sub">The banner will be shown to players; they can click through and enter with their team.</p></div><a class="btn btn-ghost btn-sm" href="{{ url_for('admin.dashboard') }}">Back</a></div>
  <form method="POST" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="grid grid-2"><div class="form-group"><label class="form-label">Tournament name</label><input class="form-control" name="name" maxlength="120" required></div><div class="form-group"><label class="form-label">Banner image (PNG, JPG, JPEG, WEBP)</label><input class="form-control" type="file" name="banner" accept=".png,.jpg,.jpeg,.webp"></div></div>
    <div class="grid grid-3"><div class="form-group"><label class="form-label">Free Fire map</label><select class="form-control" name="map_name" required>{% for map in maps %}<option>{{ map }}</option>{% endfor %}</select></div><div class="form-group"><label class="form-label">Game mode</label><select class="form-control" name="game_mode" required>{% for mode in modes %}<option>{{ mode }}</option>{% endfor %}</select></div><div class="form-group"><label class="form-label">Match type</label><select class="form-control" name="tournament_type" required><option value="solo">Solo</option><option value="duo">Duo</option><option value="squad" selected>Squad</option><option value="clash_squad">Clash Squad</option></select></div></div>
    <div class="grid grid-2"><div class="form-group"><label class="form-label">Registration closes</label><input class="form-control" type="datetime-local" name="registration_deadline" required></div><div class="form-group"><label class="form-label">Match starts</label><input class="form-control" type="datetime-local" name="start_time" required></div></div>
    <div class="grid grid-4"><div class="form-group"><label class="form-label">Maximum teams</label><input class="form-control" type="number" name="max_teams" min="2" max="1000" value="48" required></div><div class="form-group"><label class="form-label">Entry fee (⚡ Tokens / ₹)</label><input class="form-control" type="number" name="entry_fee" min="0" step="0.01" value="0" required></div><div class="form-group"><label class="form-label">Prize pool (₹)</label><input class="form-control" type="number" name="prize_pool" min="0" step="0.01" value="0" required></div><div class="form-group"><label class="form-label">Per kill prize (₹)</label><input class="form-control" type="number" name="per_kill_prize" min="0" step="0.01" value="5" required></div></div>
    <div class="form-group"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3" placeholder="Tell players about this match."></textarea></div><div class="form-group"><label class="form-label">Rules</label><textarea class="form-control" name="rules" rows="4" placeholder="Room rules, reporting time, scoring, and so on."></textarea></div>
    <button class="btn btn-primary" type="submit">Publish Tournament</button>
  </form>
</div></div>
{% endblock %}
