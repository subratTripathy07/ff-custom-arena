{% extends "base.html" %}
{% block title %}429 — Too Many Requests | {{ site_name }}{% endblock %}
{% block content %}
<div class="error-page-wrapper">
  <div class="error-content">
    <div class="error-code" style="color: var(--accent-warning);">429</div>
    <div class="error-icon"><i class="fa-solid fa-gauge-high"></i></div>
    <h1 class="error-title">Slow Down, Commander!</h1>
    <p class="error-msg">You're sending too many requests. Please wait a moment before trying again.</p>
    <div class="error-actions">
      <a href="{{ url_for('main.home') }}" class="btn btn-primary"><i class="fa-solid fa-house"></i> Return to Base</a>
    </div>
  </div>
</div>
{% endblock %}
