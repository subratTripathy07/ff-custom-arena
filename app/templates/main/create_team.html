{% extends "base.html" %}
{% block content %}
<div class="container">
  <div class="card auth-shell">
    <h2 style="text-align:center; margin-bottom:26px;">Create a Team</h2>
    <form method="POST" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Team Tag</label>
        <input type="text" name="tag" class="form-control" maxlength="10" placeholder="e.g. FFA">
      </div>
      <div class="form-group">
        <label class="form-label">Team Name</label>
        <input type="text" name="name" class="form-control" placeholder="e.g. Dark Warriors" required>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="3" placeholder="Tell us about your squad"></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Team</button>
    </form>
  </div>
</div>
{% endblock %}
